name: Build Mulberry Blast IPA

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you press a "Run workflow" button

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Make the Xcode project
        run: xcodegen generate

      - name: Build the app (unsigned)
        run: |
          xcodebuild \
            -project MulberryBlast.xcodeproj \
            -scheme MulberryBlast \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Pack it into an IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MulberryBlast.app Payload/
          zip -r MulberryBlast.ipa Payload

      - name: Save the IPA so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: MulberryBlast-ipa
          path: MulberryBlast.ipa
